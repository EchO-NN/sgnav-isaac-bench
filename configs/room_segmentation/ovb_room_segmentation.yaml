map:
  resolution_m: 0.05
  z_resolution_m: 0.05
  z_min_m: 0.20
  z_max_m: 2.00
  unknown_value: -1
  free_value: 0
  occupied_value: 1

depth:
  depth_min_m: 0.20
  depth_max_m: 2.00
  ray_step_m: 0.025
  endpoint_margin_m: 0.03
  max_ray_points_per_frame: 120000
  depth_stride_px: 2
  use_depth_median_filter: true
  depth_median_kernel: 3
  use_depth_bilateral_filter: false
  invalid_depth_value: 0.0

vertical_projection:
  min_free_count_for_xy_free: 1
  min_occupied_count_for_xy_occupied: 3
  occupied_height_ratio_threshold: 0.82
  free_height_ratio_threshold: 0.08
  unknown_dominance_ratio_threshold: 0.75
  endpoint_occupied_confidence: 0.85
  through_ray_free_confidence: 0.70
  decay_per_update: 0.995
  max_log_odds: 8.0
  min_log_odds: -8.0
  free_log_odds_update: -0.65
  occupied_log_odds_update: 0.90
  endpoint_log_odds_update: 1.20

structural_wall:
  wall_probability_threshold: 0.62
  hard_wall_probability_threshold: 0.82
  free_probability_threshold: 0.55
  unknown_probability_threshold: 0.65
  min_wall_line_length_m: 0.60
  min_structural_component_area_m2: 0.03
  max_island_area_m2: 0.20
  morphology:
    close_kernel_m: 0.10
    open_kernel_m: 0.05
    fill_gap_max_m: 0.18
    preserve_openings_min_m: 0.35

free_space:
  robot_radius_m: 0.18
  safety_margin_m: 0.05
  erosion_radius_m: 0.20
  min_free_component_area_m2: 0.12
  frontier_band_m: 0.25
  unknown_as_boundary_for_distance: true
  unknown_as_wall_for_segmentation: false

skeleton:
  method: medial_axis
  prune_branch_length_m: 0.35
  min_skeleton_component_length_m: 0.50
  smooth_width_window_nodes: 5
  local_minima_window_m: 0.45
  local_minima_prominence_m: 0.10
  max_nodes: 6000

bottleneck:
  max_candidates: 120
  candidate_width_min_m: 0.35
  candidate_width_preferred_min_m: 0.45
  candidate_width_preferred_max_m: 1.60
  candidate_width_max_m: 2.80
  min_area_each_side_m2: 0.25
  min_area_ratio_after_cut: 0.04
  max_frontier_ratio_near_cut: 0.55
  frontier_penalty_band_m: 0.40
  cut_extension_step_m: 0.05
  cut_max_length_m: 3.00
  cut_connect_wall_distance_m: 0.20
  cut_raster_thickness_m: 0.07
  endpoint_wall_support_radius_m: 0.20
  side_sampling_distance_m: 0.35
  side_sampling_count: 7

visibility:
  enabled: true
  ray_count_per_node: 72
  ray_angle_span_deg: 360
  ray_max_range_m: 4.00
  ray_step_m: 0.05
  visibility_cell_sample_limit: 2000
  jaccard_epsilon: 1.0e-6
  min_visibility_cells: 20
  visibility_cache_size: 2000

place_graph:
  keyframe_interval_m: 0.35
  keyframe_interval_rad: 0.35
  skeleton_node_stride_m: 0.20
  room_center_min_distance_m: 0.70
  edge_max_geodesic_m: 1.50
  edge_max_euclidean_m: 1.20
  line_of_sight_required_for_short_edges: false
  weights:
    geodesic: 0.30
    visibility_jaccard: 0.30
    line_of_sight: 0.15
    semantic_similarity: 0.10
    bottleneck_penalty: 0.45
    frontier_penalty: 0.15

partition:
  method: union_find_with_cut
  spectral_enabled: true
  normalized_cut_enabled: true
  split_score_threshold: 0.72
  soft_split_score_threshold: 0.55
  merge_score_threshold: 0.42
  min_room_area_m2: 0.60
  min_room_observed_area_m2: 0.35
  min_room_graph_nodes: 3
  oversegmentation_merge:
    enabled: true
    max_visibility_drop_for_merge: 0.35
    min_shared_boundary_m: 0.25
    max_boundary_score_for_merge: 0.45

separator_scoring:
  weights:
    width: 0.18
    wall_support: 0.18
    visibility_drop: 0.24
    graph_conductance: 0.18
    temporal: 0.12
    frontier_penalty: 0.15
    alcove_penalty: 0.12
    area_balance: 0.10
    corridor_consistency: 0.12
  sigmoid_temperature: 1.00
  score_clip_min: 0.0
  score_clip_max: 1.0

corridor:
  enabled: true
  width_min_m: 0.45
  width_max_m: 1.80
  length_to_width_ratio_min: 2.80
  width_cv_max: 0.28
  skeleton_degree2_ratio_min: 0.65
  parallel_wall_support_min: 0.45
  max_internal_cut_score: 0.62
  side_branch_angle_min_deg: 45
  side_branch_angle_max_deg: 135
  merge_accidental_splits: true

open_space:
  enabled: true
  min_open_area_m2: 1.50
  bottleneck_absence_threshold: 0.50
  allow_functional_subzones: true

functional_zone:
  enabled: true
  geometry_only_fallback: true
  object_cluster_radius_m: 1.20
  min_objects_per_zone: 1
  semantic_embedding_weight: 0.45
  object_density_weight: 0.35
  geometry_region_weight: 0.20
  default_zone_label: unknown_functional_zone
  labels:
    - kitchen_zone
    - living_zone
    - dining_zone
    - sleeping_zone
    - working_zone
    - bathroom_zone
    - storage_zone
    - corridor_zone
    - unknown_functional_zone

temporal:
  enabled: true
  split_persistence_observations: 3
  merge_persistence_observations: 3
  room_id_iou_match_threshold: 0.35
  room_id_centroid_distance_threshold_m: 1.00
  max_room_id_age_frames: 50
  score_ema_alpha: 0.35
  mask_ema_alpha: 0.40
  confidence_decay_unobserved: 0.98
  hard_split_threshold: 0.75
  soft_split_threshold: 0.55
  merge_threshold: 0.45

output:
  output_soft_masks: true
  output_debug_layers: true
  output_room_graph: true
  output_functional_zones: true
  output_corridor_mask: true
  output_open_space_mask: true

runtime:
  max_update_time_ms: 80
  full_recompute_interval_frames: 10
  incremental_update: true
  max_grid_cells_for_full_skeleton: 400000
  downsample_for_skeleton_if_needed: true
  skeleton_downsample_factor: 2

debug:
  save_debug_images: false
  debug_image_dir: debug/room_segmentation
  visualize_skeleton: true
  visualize_bottlenecks: true
  visualize_visibility_graph: true
  visualize_room_masks: true

