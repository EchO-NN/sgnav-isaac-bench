project:
  name: sgnav_isaac_interioragent
  seed: 123
  output_dir: data/isaac_bench_runs

paths:
  sgnav_repo: /home/echo/SG-Nav
  interioragent_root: /home/echo/InteriorAgent
  isaac_sim_root: /home/echo/isaac-sim-standalone-5.1.0-linux-x86_64
  yolo_world_model: data/models/yolov8l-worldv2.pt
  grounding_dino_checkpoint: data/models/groundingdino_swinb_cogcoor.pth
  grounding_dino_config: data/models/GroundingDINO_SwinB.cfg.py

repo:
  backend: isaac
  detector: grounding_dino
  planner: astar
  use_original_scenegraph: false

benchmark:
  strict_benchmark: true
  allow_debug_fallbacks: false
  policy: sgnav_original
  ablation_name:

visualization:
  sgnav_popup: auto
  sgnav_popup_every_steps: 3
  sgnav_popup_save_dir:
  sgnav_popup_save_every_steps: 10
  sgnav_popup_width: 1440
  sgnav_popup_height: 900
  sgnav_popup_jpeg_quality: 75
  debug_overlay_layers: true
  save_overlay_layer_metadata: true
  show_gt_goal_cells: false
  show_room_proposals: true
  show_room_masks: true
  show_room_labels: true
  show_frontier_member_cells: true
  show_object_nodes: true
  show_candidate_markers: true
  max_green_like_primitives_before_warning: 200

isaac:
  headless: false
  control_dt: 0.2
  perception_every_steps: 1
  observed_radius_m: 3.0
  render_updates_per_step: 1
  read_depth: true
  camera_annotator_device: cuda

dataset:
  root: /home/echo/InteriorAgent
  scene_glob: "kujiale_*"
  preprocessed_dir: data/interioragent_preprocessed
  episodes_dir: data/interioragent_episodes
  rooms_json_name: rooms.json
  top_level_usd_pattern: "*.usd*"

scene_preprocess:
  map_resolution_m: 0.05
  robot_radius_m: 0.14
  inflation_radius_m: 0.0
  min_object_bbox_diag_m: 0.05
  include_large_furniture_as_goals: true
  exclude_categories:
    - wall
    - floor
    - ceiling
    - roof
    - door
    - window
    - other
    - baseboard
    - light_switch
    - outlet

episodes:
  episodes_per_scene: 100
  min_start_goal_distance_m: 1.5
  max_start_goal_distance_m: 25.0
  min_start_object_clearance_m: 0.80
  min_start_goal_bbox_distance_m: 1.5
  min_goal_clearance_m: 0.80
  min_planning_clearance_m: 0.0
  success_distance_m: 0.2
  success_requires_stop: true
  success_requires_visible: false
  max_steps: 500
  max_time_s: 300
  max_path_length_m: 80.0
  max_attempts_per_episode: 2000
  yaw_sampling: uniform
  balance_goal_categories: true

robot:
  name: kaya
  usd_path: "${ISAAC_ASSETS}/Isaac/Robots/NVIDIA/Kaya/kaya.usd"
  base_frame: base_link
  camera_frame: camera_rgbd
  spawn_height_m: 0.05
  max_vx_mps: 0.15
  max_vy_mps: 0.15
  max_wz_radps: 0.35
  cmd_hz: 10
  footprint_width_m: 0.28
  footprint_radius_m: 0.14

camera:
  width: 640
  height: 480
  hfov_deg: 110.0
  mast_height_m: 1.35
  forward_offset_m: 0.0
  pitch_deg: 0.0
  near_m: 0.02
  far_m: 5.0
  publish_hz: 5

nearfield_depth:
  enabled: false
  width: 192
  height: 192
  hfov_deg: 115.0
  height_m: 1.15
  near_m: 0.02
  far_m: 1.8
  radius_m: 1.2
  ignore_radius_m: 0.14
  depth_stride_px: 3
  floor_tolerance_m: 0.12
  obstacle_min_height_m: 0.18
  obstacle_max_height_m: 0.90
  splat_point_threshold: 2
  free_splat_point_threshold: 1

nearfield_static_map:
  enabled: false
  radius_m: 1.0

mapping:
  online_resolution_m: 0.05
  map_size_m: 40.0
  depth_max_m: 3.0
  depth_min_m: 0.20
  depth_stride_px: 8
  obstacle_min_height_m: 0.20
  obstacle_max_height_m: 0.90
  free_min_height_m: -1.50
  free_max_height_m: 0.10
  splat_point_threshold: 6
  free_splat_point_threshold: 1
  debug: false
  inflation_radius_m: 0.0
  frontier_min_cluster_size: 1
  frontier_min_distance_m: 1.0
  frontier_max_count: 0
  frontier_obstacle_dilation_radius_cells: 4
  frontier_unknown_dilation_radius_cells: 1
  frontier_unknown_source: observed
  frontier_cluster_distance_mode: mean
  frontier_allow_near_fallback: false
  frontier_debug_dump: false
  frontier_debug_dir: data/debug_frontier
  room_map_mode: rose2_source_faithful_v1_vlm
  strict_no_oracle_rooms: true
  room_segmentation:
    enabled: true
    algorithm: rose2_source_faithful_v1
    backend: rose2_source_faithful_v1
    source_mode: source_form_no_ros
    legacy_watershed_allowed: debug_only
    local_rose2_lite_allowed: debug_only
    require_upstream_source_for_strict: true
    upstream_repo_env: ROSE2_SOURCE_ROOT
    run_only_before_frontier_scoring: true
    source_grid: online_depth_observed
    proposal_mode: distance_watershed
    finalization_mode: no_merge_until_source_backend_verified
    use_structural_obstacle_mask: true
    suppress_furniture_obstacles: true
    debug_rose2_source: false
    rose2_source_work_dir: debug/rose2_source
    rose2_compare_legacy: false
    strict_disallow_legacy_fallback: true
    source_form:
      min_cell_area_m2: 0.35
      min_cell_free_ratio: 0.12
      min_cut_spacing_m: 0.45
      axis_snap_angle_rad: 0.488692191
      max_cuts_per_axis: 96
      thin_wall_separator_enabled: true
      thin_wall_min_length_m: 0.35
      thin_wall_max_width_m: 0.30
      thin_wall_min_aspect_ratio: 3.0
      thin_wall_free_support_band_m: 0.30
      thin_wall_min_free_support_ratio: 0.20
      thin_wall_max_unknown_overlap_ratio: 0.25
      topology_effective_separator_enabled: true
      topology_effective_min_largest_component_drop: 0.08
      topology_effective_min_component_area_m2: 1.0
      topology_effective_max_candidates: 256
      doorway_partition_enabled: true
      doorway_width_min_m: 0.45
      doorway_width_max_m: 1.60
      doorway_min_wall_support_on_sides_m: 0.35
      doorway_max_unknown_ratio: 0.20
      merge_guard_enabled: true
      block_merge_across_thin_wall: true
      block_merge_across_doorway_partition: true
      block_merge_across_topology_separator: true
    vertical_or_free:
      enabled: true
      z_min_m: 0.20
      z_max_m: 2.00
      floor_band_m: [0.10, 0.35]
      robot_body_band_m: [0.35, 0.80]
      mid_band_m: [0.80, 1.30]
      upper_band_m: [1.30, 2.00]
      min_free_rays: 1
      min_observed_rays: 1
    debug_layers:
      enabled: false
      output_dir: debug/roomseg_layers
      max_saves: 50
      save_npz: true
      save_png: true
      save_summary_json: true
      include_selected_frontier_sector: true
    navigation_free_context_overlay:
      enabled: false
      use_for_room_nodes: true
      use_for_visualization: true
      use_for_frontier_room_assignment: true
      max_absorb_distance_m: 1.25
      min_seed_room_area_cells: 20
      protect_unknown: true
      do_not_cross_structural_boundary: true
      do_not_cross_obstacle: true
      reliability_for_absorbed_cells: 0.35
    frontier_room_context:
      enabled: true
      use_known_free_side: true
      local_radius_m: 0.35
      nearest_fallback_radius_m: 1.25
      min_label_ratio: 0.20
      use_context_overlay_labels: true
    wall_gating_debug:
      enabled: true
    wall_gating_fix:
      enabled: false
      mode: candidate_wall_component_gate
      keep_perimeter_walls: true
      keep_high_confidence_walls: true
      keep_line_supported_walls: true
      min_component_area_cells: 4
    update_every_steps: 5
    min_observed_free_cells: 50
    min_room_area_m2: 1.5
    max_clutter_component_area_m2: 4.0
    min_wall_line_length_m: 1.5
    wall_like_aspect_ratio_min: 3.0
    morphology_close_radius_m: 0.20
    morphology_open_radius_m: 0.10
    distance_smooth_sigma_cells: 1.0
    seed_min_clearance_m: 0.45
    seed_min_distance_m: 1.2
    doorway_width_min_m: 0.55
    doorway_width_max_m: 1.45
    doorway_clearance_max_m: 0.85
    doorway_wall_support_min_ratio: 0.35
    doorway_unknown_support_max_ratio: 0.20
    doorway_endpoint_wall_distance_m: 0.35
    doorway_neck_ratio_max: 0.55
    open_boundary_merge: true
    merge_same_semantic_category: true
    merge_unknown_into_open_labeled_region: true
    use_premerge_labels_for_open_plan_merge: true
    min_label_reliability_for_functional_split: 0.65
    unknown_allows_functional_split: false
    final_label_after_merge: true
    merge_wide_openings: true
    small_segment_merge_area_m2: 1.2
    id_iou_threshold: 0.35
    unknown_boundary_confidence_penalty: true
    debug_dump: true
    debug_dir: debug/roomseg
    wall_confidence_threshold: 0.55
    vertical_free_suppression_weight: 0.35
    object_overlap_suppression_weight: 0.45
    line_support_weight: 0.25
    continuity_weight: 0.45
    persistence_weight: 0.10
    single_view_penalty: 0.20
    surrounded_by_free_penalty: 0.25
    bulky_component_penalty: 0.25
    furniture_suppression_radius_m: 0.90
    wall_like_aspect_ratio_min: 4.0
    exterior_margin_cells: 2
    rose2:
      dominant_direction_count: 2
      directional_filter_width_rad: 0.244346095
      hough_min_line_length_m: 1.0
      hough_line_gap_m: 0.25
      wall_cluster_distance_m: 0.35
      wall_cluster_gap_m: 0.50
      wall_min_support_ratio: 0.25
      wall_extension_enabled: true
      wall_extension_band_m: 0.45
      wall_extension_margin_m: 0.15
      topology_split_enabled: true

perception:
  yolo_world_model: data/models/yolov8l-worldv2.pt
  grounding_dino:
    variant: GroundingDINO-B/Swin-B
    repo_id: ShilongLiu/GroundingDINO
    checkpoint: data/models/groundingdino_swinb_cogcoor.pth
    config: data/models/GroundingDINO_SwinB.cfg.py
    device: cuda
    text_threshold: 0.25
  use_ultralytics: true
  detection_localization: depth
  segmenter: sam2
  sam2_checkpoint: data/models/sam2.1_hiera_small.pt
  sam2_model_cfg: configs/sam2.1/sam2.1_hiera_s.yaml
  sam2_device: cuda
  confidence_threshold: 0.45
  min_valid_detection_confidence: 0.45
  nms_iou_threshold: 0.5
  prompt_mode: global_dataset_vocab
  max_detections_per_frame: 100
  object_merge_radius_m: 0.5
  object_forget_after_steps: 100
  min_depth_points_per_detection: 20
  yolo_world:
    reject_edge_touching_bboxes: false
    bbox_edge_margin_px: 2
    bbox_edge_margin_ratio: 0.0
    category_accumulation: true
    mask_aware_partial_tracking: true

object_memory:
  category_update_mode: confidence_sum
  expose_mean_confidence: true
  expose_detection_count: true
  use_edge_touching_detections_for_policy: false
  partial_class_weight: 0.25
  min_geometry_confidence: 0.50
  partial_stability_min_observations: 3
  mask_iou_association_threshold: 0.25
  mask_iou_track_match_threshold: 0.25
  mask_containment_track_match_threshold: 0.60
  footprint_iou_association_threshold: 0.20
  footprint_iou_track_match_threshold: 0.20
  child_containment_threshold: 0.70
  child_area_ratio_threshold: 0.35
  child_object_area_ratio_max: 0.35

room_semantics:
  use_premerge_labels_for_open_plan_merge: true
  min_label_reliability_for_functional_split: 0.65
  unknown_allows_functional_split: false
  final_label_after_merge: true

sgnav:
  mode: paper
  seed_gt_object_memory: false
  allow_gt_goal_fallback: false
  panorama_steps: 8
  panorama_wz_radps: 0.8
  panorama_render_updates_per_step: 1
  frontier_distance_weight: 0.2
  frontier_scenegraph_score_norm: none
  frontier_commitment_enabled: true
  frontier_commit_match_radius_m: 0.75
  frontier_commit_reached_radius_m: 0.60
  frontier_commit_min_steps: 12
  frontier_commit_max_steps: 120
  frontier_commit_switch_margin: 0.25
  frontier_commit_switch_ratio: 1.15
  frontier_commit_no_progress_steps: 25
  frontier_commit_progress_min_delta_m: 0.10
  frontier_blacklist_ttl_steps: 100
  semantic_priors_path: isaac_bench/configs/sgnav_semantic_priors.yaml
  debug_graph_dump: false
  debug_graph_dump_dir: debug/graphs
  candidate_min_detector_hits: 2
  candidate_start_min_confidence: 0.45
  candidate_start_min_hits: 2
  candidate_recent_max_age_steps: 30
  candidate_match_substring: false
  candidate_accept_requires_reperception: true
  candidate_reject_ttl_steps: 80
  candidate_accept_threshold: 0.8
  candidate_stop_distance_m: 1.0
  candidate_standoff_min_m: 0.65
  candidate_standoff_max_m: 1.80
  candidate_standoff_max_cells: 16
  candidate_standoff_ideal_m: 1.0
  reperception_enabled: true
  reperception_min_observations: 3
  reperception_max_steps: 10
  reperception_same_goal_radius_m: 0.8
  reperception_turn_wz_radps: 0.5
  stop_verification_steps: 4
  stop_verification_min_hits: 2
  found_goal_stop_distance_m: 0.35
  perception:
    instance_source: grounding_dino_sam2_depth_fusion
    instance_merge_distance_m: 0.75
    instance_merge_iou_3d: 0.15
  scene_graph:
    enabled: true
    node_types:
      object: true
      group: true
      room: true
    dense_connect_new_objects: true
    llm_edge_batching: true
    short_edge_vlm_pruning: true
    long_edge_geometric_pruning: true
    group_nodes: true
    room_nodes:
      source: rose2_source_faithful_v1_vlm
      use_dataset_room_labels_in_metric: false
      strict_no_oracle_rooms: true
      room_label_backend: vlm
      allowed_room_categories:
        - kitchen
        - bedroom
        - bathroom
        - living_room
        - dining_room
        - office
        - hallway
        - corridor
        - laundry_room
        - storage_room
        - entryway
        - balcony
        - unknown
      unknown_category: unknown
      room_label_min_confidence: 0.60
      room_label_ambiguity_margin: 0.15
      room_label_min_reliable_objects: 2
      room_label_hysteresis_updates: 2
      include_room_mask_thumbnail: true
      include_room_rgb_views: true
      max_room_rgb_views: 3
      max_room_objects_in_prompt: 25
  subgraph:
    enabled: true
    type: object_centered
    include_parent_room: true
    include_parent_group: true
    include_direct_object_neighbors: true
    cache_scores: true
  hc_p_prompting:
    enabled: true
    strict_json: true
    max_retries: 2
    min_distance_m: 0.25
    probability_normalization: true
  frontier:
    use_fbe: true
    scoring: subgraph_interpolation
    min_distance_m: 0.25
  local_policy:
    type: astar_deterministic_backend
  reperception:
    enabled: true
    method: graph_based
    n_max: 10
    s_thres: 0.8

vllm:
  frontier_scoring: false
  base_url: http://127.0.0.1:8000/v1
  model: qwen3-vl-8b-instruct
  timeout_s: 8.0
  temperature: 0.0
  max_frontiers: 32
  score_frontiers_before_candidate: true
  image_scoring: true
  image_max_width: 640
  image_jpeg_quality: 75

llm:
  enabled: true
  base_url: http://127.0.0.1:8000/v1
  model: qwen3-vl-8b-instruct
  api_key: EMPTY
  timeout_s: 30.0
  temperature: 0.0
  max_tokens: 512
  max_hcot_subgraphs_per_decision: 8

astar:
  allow_diagonal: true
  unknown_is_obstacle: true
  goal_tolerance_m: 0.20
  waypoint_lookahead_m: 0.15
  replan_every_steps: 5
  runtime_planning_clearance_m: 0.10
  stuck_timeout_steps: 30

nav2:
  use_nav2: false
  map_yaml_dir: data/interioragent_nav2_maps
  action_name: /navigate_to_pose

metrics:
  actual_path_from_gt_pose: true
  distance_to_goal_mode: astar_to_nearest_goal_region
  spl_shortest_path_mode: astar_full_map
  softspl_enabled: true
  log_every_step: true
